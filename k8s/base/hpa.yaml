apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudpulse-hpa
  namespace: cloudpulse
  labels:
    app: cloudpulse
    app.kubernetes.io/name: cloudpulse
    app.kubernetes.io/part-of: cloudpulse-stack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudpulse
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

